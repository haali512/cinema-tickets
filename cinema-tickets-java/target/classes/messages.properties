# Error messages for rejected ticket purchases.
# Messages are formatted with java.text.MessageFormat, so {0} is replaced with an argument
# and a single quote must be written as two ('').

purchase.error.account.invalid=Account id must be greater than zero
purchase.error.request.empty=At least one ticket request must be provided
purchase.error.request.null=Ticket request must not be null
purchase.error.type.missing=Ticket type must be specified
purchase.error.quantity.invalid=Number of tickets must be greater than zero
purchase.error.quantity.maximum=Cannot purchase more than {0} tickets at a time
purchase.error.adult.required=Child and infant tickets cannot be purchased without an adult ticket
purchase.error.infant.lap=Each infant must sit on an adult''s lap, so infants cannot outnumber adults
